name: Closet sync (feed + new sales + weekly recap)
on:
  schedule:
    - cron: "17 * * * *"    # hourly feed + new-sales check
    - cron: "0 13 * * 1"    # weekly recap, Mondays 13:00 UTC (9 AM New York, EDT)
  workflow_dispatch:
    inputs:
      recap:
        description: "Also build the weekly recap"
        type: boolean
        default: true
      deploy:
        description: "Deploy to shantells-closet.surge.sh"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: closet-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: sync-state, path: state }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build feed and detect new sales
        env: { SITE_DIR: "${{ github.workspace }}/site", STATE_DIR: "${{ github.workspace }}/state" }
        run: python3 sync/build_feed.py --no-deploy
      - name: Weekly recap
        if: github.event.schedule == '0 13 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.recap)
        env: { SITE_DIR: "${{ github.workspace }}/site", STATE_DIR: "${{ github.workspace }}/state" }
        run: python3 sync/weekly_recap.py
      - name: Publish outputs into the site
        run: cp state/new_sales.json state/recap.html state/recap.json site/
      - name: Deploy to Surge (same domain)
        if: github.event_name == 'schedule' || inputs.deploy
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        run: npx -y surge ./site shantells-closet.surge.sh
      - name: Save state
        working-directory: state
        run: |
          git config user.name "closet-sync"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -qm "sync $(date -u +%FT%TZ)"; git push -q; }
          python3 -c "import json;print('new_sales',len(json.load(open('new_sales.json'))),'seen',len(json.load(open('seen_sold_ids.json'))))"
