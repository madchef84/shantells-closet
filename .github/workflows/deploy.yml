name: Deploy Closet app (Surge)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
jobs:
  surge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bump service-worker cache version
        run: sed -i -E "s/const C='shantells-closet-[^']*'/const C='shantells-closet-gh${GITHUB_RUN_NUMBER}'/" site/sw.js && head -c 120 site/sw.js
      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        run: npx -y surge ./site shantells-closet.surge.sh
      - name: Check live
        run: curl -fsS -o /dev/null -w "%{http_code}\n" https://shantells-closet.surge.sh/
